version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: driti-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./driti.db
      - SECRET_KEY=change-me
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driti-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
